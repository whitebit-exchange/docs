asyncapi: 3.0.0
info:
  title: WhiteBit Order Book L2
  version: 1.0.0
  description: |
    Level 2 order book stream. Volumes are aggregated by price level: each level carries the
    total amount at that price. After subscription the server sends a full snapshot, then
    incremental updates that the client applies to a local copy of the order book. The channel
    does not support query operations — only subscribe, update, and unsubscribe.
  x-auth-required: false
  x-rate-limits:
    connections-per-minute: 1000
    requests-per-10-seconds: 12000

servers:
  production:
    host: wss.whitebit.com
    protocol: wss
    description: WhiteBIT Global Server
  eu:
    host: api.whitebit.eu
    protocol: wss
    description: WhiteBIT EU Server

channels:
  /ws:
    address: /ws
    description: |
      Level 2 order book operations.

      **Update Behavior**:

      <Note>
      After successful subscription, the server sends a full snapshot of the order book as the first `orderbook_l2.update` message (`params[0]` is `"s"`). Subsequent messages are incremental updates (`params[0]` is an array of records, each starting with `"u"`).
      </Note>

      <Note>
      Retail Price Improvement (RPI) orders are not included in the snapshot or in updates.
      </Note>

    messages:
      orderbookL2Subscribe:
        $ref: '#/components/messages/orderbookL2Subscribe'
      orderbookL2SubscribeResponse:
        $ref: '#/components/messages/orderbookL2SubscribeResponse'
      orderbookL2Update:
        $ref: '#/components/messages/orderbookL2Update'
      orderbookL2Unsubscribe:
        $ref: '#/components/messages/orderbookL2Unsubscribe'
      orderbookL2UnsubscribeResponse:
        $ref: '#/components/messages/orderbookL2UnsubscribeResponse'

operations:
  sendOrderbookL2Subscribe:
    action: receive
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderbookL2Subscribe'

  receiveOrderbookL2SubscribeResponse:
    action: send
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderbookL2SubscribeResponse'

  receiveOrderbookL2Updates:
    action: send
    description: Receive the full order book snapshot (first), then incremental order book updates
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderbookL2Update'

  sendOrderbookL2Unsubscribe:
    action: receive
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderbookL2Unsubscribe'

  receiveOrderbookL2UnsubscribeResponse:
    action: send
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderbookL2UnsubscribeResponse'

components:
  messages:
    orderbookL2Subscribe:
      name: OrderbookL2Subscribe
      title: Subscribe to Order Book L2
      summary: Subscribe to the level 2 order book of a market
      payload:
        $ref: '#/components/schemas/OrderbookL2Subscribe'
      examples:
        - name: orderbookL2Subscribe
          summary: |
            Subscribe to the order book with parameters:
            - params[0]: Market name (BTC_USDT)
            - params[1]: Limit — depth per side (1000)
            - params[2]: Multiple subscription flag (true = add the market to existing subscriptions)
          payload:
            id: 1234
            method: orderbook_l2.subscribe
            params:
              - BTC_USDT
              - 1000
              - true

    orderbookL2SubscribeResponse:
      name: OrderbookL2SubscribeResponse
      title: Subscribe Response
      summary: Subscription confirmation
      payload:
        $ref: '#/components/schemas/StatusResponse'
      examples:
        - name: orderbookL2SubscribeResponse
          summary: Subscription confirmed
          payload:
            id: 1234
            result:
              status: success
            error: null

    orderbookL2Update:
      name: OrderbookL2Update
      title: Order Book Update
      summary: Full snapshot (first), then incremental updates
      payload:
        $ref: '#/components/schemas/OrderbookL2Update'
      examples:
        - name: orderbookL2Snapshot
          summary: |
            Full order book snapshot (first message after subscription):
            - params[0]: "s" (snapshot marker)
            - params[1]: Timestamp in seconds with fractional part
            - params[2]: Market name (BTC_USDT)
            - params[3]: Asks, sorted ascending by price
            - params[4]: Bids, sorted descending by price
          payload:
            id: null
            method: orderbook_l2.update
            params:
              - s
              - 1791809602.4971621
              - BTC_USDT
              - - - "82900.12"
                  - "0.034248"
                - - "82905.5"
                  - "0.5"
              - - - "82900.11"
                  - "0.1"
                - - "82899.8"
                  - "0.25"

        - name: orderbookL2Update
          summary: |
            Single-record update — the amount at one price level changed:
            - Each record: type ("u"), timestamp, market, side ("a" or "b"), price, amount
            - amount is the new absolute volume at the level, not a delta
          payload:
            id: null
            method: orderbook_l2.update
            params:
              - - u
                - 1791809610.102933
                - BTC_USDT
                - b
                - "82900.11"
                - "0.35"
        - name: orderbookL2DoubleUpdate
          summary: |
            Two-record update — one level is removed (amount "0") and a new level is added.
            Apply both records as a single change.
          payload:
            id: null
            method: orderbook_l2.update
            params:
              - - u
                - 1791809620.517216
                - BTC_USDT
                - a
                - "82900.12"
                - "0"
              - - u
                - 1791809620.517216
                - BTC_USDT
                - a
                - "82909.04"
                - "0.008509"

    orderbookL2Unsubscribe:
      name: OrderbookL2Unsubscribe
      title: Unsubscribe from Order Book L2
      summary: Stop receiving order book L2 updates
      payload:
        $ref: '#/components/schemas/OrderbookL2Unsubscribe'
      examples:
        - name: orderbookL2Unsubscribe
          summary: |
            Unsubscribe from a specific market:
            - params[0]: Market name (BTC_USDT)
            Optional: an empty array unsubscribes from all markets
          payload:
            id: 1235
            method: orderbook_l2.unsubscribe
            params:
              - BTC_USDT

    orderbookL2UnsubscribeResponse:
      name: OrderbookL2UnsubscribeResponse
      title: Unsubscribe Response
      summary: Unsubscription confirmation
      payload:
        $ref: '#/components/schemas/StatusResponse'
      examples:
        - name: orderbookL2UnsubscribeResponse
          summary: Unsubscription confirmed
          payload:
            id: 1235
            result:
              status: success
            error: null

  schemas:
    PriceLevel:
      type: array
      description: |
        Order book level tuple:
        - [0] Price level (string)
        - [1] Total amount at the price, in the base currency (string)
      minItems: 2
      maxItems: 2
      items:
        - type: string
          description: Price
        - type: string
          description: Amount

    OrderbookL2Subscribe:
      type: object
      required:
        - id
        - method
        - params
      properties:
        id:
          type: integer
          description: Unique request identifier
        method:
          type: string
          const: orderbook_l2.subscribe
          description: "Method name. Fixed value: `orderbook_l2.subscribe`."
        params:
          type: array
          description: |
            Subscription parameters:
            - [0] Market name
            - [1] Limit — order book depth per side (1, 5, 10, 50, 100, 500, or 1000)
            - [2] Multiple subscription flag (optional, default false)
          minItems: 2
          maxItems: 3
          items:
            - type: string
              description: "[Market](/glossary#market) name"
              x-field-name: market
              x-required: true
              x-example: "BTC_USDT"
            - type: integer
              enum: [1, 5, 10, 50, 100, 500, 1000]
              description: "Order book depth per side. The client keeps only this many best levels per side after each message."
              x-field-name: limit
              x-required: true
              x-example: 1000
            - type: boolean
              description: "Multiple subscription flag. `true` adds the market to existing `orderbook_l2` subscriptions. `false` (the default when omitted) cancels all current `orderbook_l2` subscriptions and keeps only this one."
              x-field-name: multiple_subscription
              x-required: false
              x-example: true

    StatusResponse:
      type: object
      required:
        - id
        - result
        - error
      properties:
        id:
          type: integer
          description: Identifier of the original request
        result:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              const: success
              description: "Fixed value: `success`."
        error:
          type: "null"

    OrderbookL2SnapshotParams:
      type: array
      description: |
        Snapshot parameters:
        - [0] Snapshot marker ("s")
        - [1] Timestamp
        - [2] Market name
        - [3] Asks
        - [4] Bids
      minItems: 5
      maxItems: 5
      items:
        - type: string
          const: s
          description: "Snapshot marker. Fixed value: `s`."
          x-field-name: type
          x-example: "s"
        - type: number
          description: Unix time in seconds with fractional part
          x-field-name: timestamp
          x-example: 1791809602.4971621
        - type: string
          description: "[Market](/glossary#market) name"
          x-field-name: market
          x-example: "BTC_USDT"
        - type: array
          description: "Ask levels as `[price, amount]` tuples, sorted ascending by price. Depth is `limit` from the subscription."
          items:
            $ref: '#/components/schemas/PriceLevel'
          x-field-name: asks
        - type: array
          description: "Bid levels as `[price, amount]` tuples, sorted descending by price. Depth is `limit` from the subscription."
          items:
            $ref: '#/components/schemas/PriceLevel'
          x-field-name: bids

    OrderbookL2Update:
      type: object
      required:
        - id
        - method
        - params
      properties:
        id:
          type: "null"
        method:
          type: string
          const: orderbook_l2.update
          description: "Method name. Fixed value: `orderbook_l2.update`."
        params:
          description: |
            Snapshot (first message after subscription) or incremental update.
            - Snapshot: a flat tuple, `params[0]` is the string `"s"`.
            - Update: an array of one or two update records, `params[0]` is an array.
          oneOf:
            - $ref: '#/components/schemas/OrderbookL2SnapshotParams'
            - type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/OrderbookL2UpdateRecord'

    OrderbookL2UpdateRecord:
      type: array
      description: |
        Update record:
        - [0] Update marker ("u")
        - [1] Timestamp
        - [2] Market name
        - [3] Side ("a" = ask, "b" = bid)
        - [4] Price
        - [5] New total amount at the level
      minItems: 6
      maxItems: 6
      items:
        - type: string
          const: u
          description: "Update marker. Fixed value: `u`."
          x-field-name: type
          x-example: "u"
        - type: number
          description: Unix time in seconds with fractional part
          x-field-name: timestamp
          x-example: 1791809620.517216
        - type: string
          description: "[Market](/glossary#market) name"
          x-field-name: market
          x-example: "BTC_USDT"
        - type: string
          enum: [a, b]
          description: "Order book side: `a` — ask (sell), `b` — bid (buy)."
          x-field-name: side
          x-example: "a"
          x-enum-labels:
            a: Ask
            b: Bid
        - type: string
          description: Price of the level
          x-field-name: price
          x-example: "82909.04"
        - type: string
          description: "New total amount at the level, in the base currency. This is an absolute value, not a delta. `\"0\"` removes the level."
          x-field-name: amount
          x-example: "0.008509"

    OrderbookL2Unsubscribe:
      type: object
      required:
        - id
        - method
        - params
      properties:
        id:
          type: integer
          description: Unique request identifier
        method:
          type: string
          const: orderbook_l2.unsubscribe
          description: "Method name. Fixed value: `orderbook_l2.unsubscribe`."
        params:
          type: array
          minItems: 0
          maxItems: 1
          description: "Empty array unsubscribes from all markets; a single [market](/glossary#market) name unsubscribes from that market only."
          items:
            type: string
            description: "[Market](/glossary#market) name"
