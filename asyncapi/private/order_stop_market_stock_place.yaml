asyncapi: 3.0.0
info:
  title: WhiteBit Place Spot Stop-Market Order Sized in Stock
  version: 1.0.0
  description: |
    Place a spot stop-market order sized in the base asset on both sides.

    The trigger semantics match `order_stop_market_place`; only the unit of `amount` differs.
    Here `amount` is always [stock](/glossary#stock), on a buy as well as on a sell.
  x-auth-required: true
  x-rate-limits:
    connections-per-minute: 1000
    requests-per-minute: 200
  x-error-codes:
    - code: 101
      message: activation price should not be equal to the last price
      description: "The activation price equals the current last price. Move the trigger to either side of it."
    - code: 251
      message: activation price is out of bands
      description: "The activation price falls outside the market price bands."
    - code: 10
      message: balance not enough
      description: "On a buy the engine spends money at activation, so the balance must cover the amount multiplied by the best ask, plus fee."
    - code: 42
      message: order slippage threshold
      description: "The slippage guard stopped the order created on activation."
    - code: 51
      message: trading in the market is not allowed
      description: "Trading is suspended, or the market runs in post-only mode — a stop method is rejected there."

servers:
  production:
    host: wss.whitebit.com
    protocol: wss
    description: WhiteBIT Global Server
  eu:
    host: api.whitebit.eu
    protocol: wss
    description: WhiteBIT EU Server

channels:
  /ws:
    address: /ws
    description: Spot stock-denominated stop-market order placement channel
    messages:
      orderStopMarketStockPlaceRequest:
        $ref: '#/components/messages/orderStopMarketStockPlaceRequest'
      orderStopMarketStockPlaceResponse:
        $ref: '#/components/messages/orderStopMarketStockPlaceResponse'

operations:
  sendOrderStopMarketStockPlaceRequest:
    action: receive
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderStopMarketStockPlaceRequest'

  receiveOrderStopMarketStockPlaceResponse:
    action: send
    channel:
      $ref: '#/channels/~1ws'
    messages:
      - $ref: '#/channels/~1ws/messages/orderStopMarketStockPlaceResponse'

components:
  messages:
    orderStopMarketStockPlaceRequest:
      name: OrderStopMarketStockPlaceRequest
      title: Place stop-market order in stock
      summary: Place a spot stop-market order sized in stock
      payload:
        $ref: '#/components/schemas/OrderStopMarketStockPlaceRequest'
      examples:
        - name: orderStopMarketStockPlaceSell
          summary: |
            Place a sell stop-market order with parameters:
            - params[0]: order object with market, side, amount in stock, and activation_price
          payload:
            id: 500007
            method: order_stop_market_stock_place
            params:
              - market: ETH_USDT
                side: sell
                amount: "0.00108"
                activation_price: "1859.73"
                stp: "no"

    orderStopMarketStockPlaceResponse:
      name: OrderStopMarketStockPlaceResponse
      title: Place Stop-Market Order In Stock Response
      summary: Accepted conditional order (status OPEN, not activated)
      payload:
        $ref: '#/components/schemas/OrderStopMarketStockPlaceResponse'
      examples:
        - name: orderStopMarketStockPlaceAccepted
          summary: Order waiting for the trigger, activation_condition derived as lte
          payload:
            id: 500007
            result:
              id: 2423735877172
              market: ETH_USDT
              type: 203
              side: 1
              post_only: false
              ioc: false
              ctime: 1786452690.913759
              mtime: 1786452690.913759
              activation_price: "1859.73"
              activation_condition: lte
              activated: 0
              price: "0"
              amount: "0.00108"
              left: "0.00108"
              deal_stock: "0"
              deal_money: "0"
              deal_fee: "0"
              client_order_id: ""
              stp: "no"
              status: OPEN
            error: null

  schemas:
    OrderStopMarketStockPlaceRequest:
      type: object
      required:
        - id
        - method
        - params
      properties:
        id:
          type: integer
          description: Unique request identifier. The response echoes this value.
        method:
          type: string
          const: order_stop_market_stock_place
          description: "Method name. Fixed value: `order_stop_market_stock_place`."
        params:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/OrderStopMarketStockPlaceParams'
          description: Array containing exactly one order parameter object

    OrderStopMarketStockPlaceParams:
      type: object
      required:
        - market
        - side
        - amount
        - activation_price
      properties:
        market:
          type: string
          description: "Spot market name. A futures market is rejected with error `1`."
          example: ETH_USDT
        side:
          type: string
          enum: ["buy", "sell"]
          description: "Order side. The response reports the side numerically: `1` for sell, `2` for buy."
        amount:
          type: string
          description: "Order size in stock on both sides, at the market stock precision."
          example: "0.00108"
        activation_price:
          type: string
          description: "Trigger price, validated against the market price bands. Outside them the call returns error `251`."
          example: "1859.73"
        client_order_id:
          type: string
          description: "Custom client order id, echoed on the response. Must be unique among active orders — a collision returns error `43`."
        stp:
          type: string
          enum: ["no", "co", "cn", "cb"]
          description: "Self-trade prevention mode applied to the order created on activation. Defaults to `no` when omitted."

    OrderStopMarketStockPlaceResponse:
      type: object
      required:
        - id
        - result
        - error
      properties:
        id:
          type: integer
          description: Request identifier matching the request
        result:
          type: object
          description: "Accepted conditional order with `price` `\"0\"`. Reports `type` `203`, the stock-denominated stop-market code."
        error:
          type: "null"
          description: Error object (null on success)
